  :root {
    --red: #d0112b;
    --red-hi: #e8213c;
    --red-lo: #a90b21;
    --navy: #0a1f3d;
    --paper: #ffffff;
    --paper-lo: #eef1f6;
    --ink: #0a1f3d;
    --safe-x: 96px;
    --zone-bottom: 66px;
    --zone-height: 86px;
    --slant: 30px;
    --ease-in: cubic-bezier(.16, .84, .24, 1);
    --ease-out: cubic-bezier(.6, 0, .84, .3);
  }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  body { font-family: "PcrCairo", Tahoma, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  .bn {
    position: absolute; right: var(--safe-x); left: var(--safe-x);
    bottom: var(--zone-bottom); height: var(--zone-height);
    display: flex; align-items: stretch;              /* RTL: label | headline | clock */
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .38));
  }

  /* red label with a slanted inner edge; a light sweep passes over it */
  .label {
    position: relative; z-index: 2; overflow: hidden;
    background: linear-gradient(180deg, var(--red-hi), var(--red-lo));
    color: #fff; font-weight: 900; font-size: 46px; line-height: 1;
    display: flex; align-items: center;
    padding: 0 38px 6px calc(38px + var(--slant));
    clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
    transition: clip-path 220ms var(--ease-out) 260ms;
  }
  .label::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
    transform: translateX(120%);
  }
  .bn.in .label {
    clip-path: polygon(var(--slant) 0, 100% 0, 100% 100%, 0 100%);
    transition: clip-path 320ms var(--ease-in) 0ms;
  }
  .bn.in .label::after { animation: sweep 3.2s ease-in-out 900ms infinite; }
  @keyframes sweep { 0% { transform: translateX(120%); } 45%, 100% { transform: translateX(-120%); } }

  /* headline bar: tucked under the label's slant */
  .bar {
    position: relative; z-index: 1; flex: 1; min-width: 0;
    margin-right: calc(-1 * var(--slant));
    background: linear-gradient(180deg, var(--paper), var(--paper-lo));
    box-shadow: inset 0 4px 0 var(--red);
    display: flex; align-items: center; overflow: hidden;
    padding: 0 calc(30px + var(--slant)) 4px 30px;
    clip-path: inset(0 0 0 100%);
    transition: clip-path 260ms var(--ease-out) 80ms;
  }
  .bn.in .bar { clip-path: inset(0 0 0 0); transition: clip-path 560ms var(--ease-in) 160ms; }

  .headline {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    unicode-bidi: plaintext; max-width: 100%;
    color: var(--ink); font-weight: 800; font-size: 42px; line-height: 1.8;   /* room for the dots below ي (overflow is hidden) */
    opacity: 0; transform: translateY(40%);
    transition: opacity 140ms linear, transform 140ms var(--ease-out);
  }
  .bn.in .headline {
    opacity: 1; transform: none;
    transition: opacity 260ms linear 520ms, transform 380ms var(--ease-in) 480ms;
  }
  .bn.in.live .headline { transition: opacity 220ms linear, transform 300ms var(--ease-in); }
  /* new headline while on air: old one leaves upwards, new one comes up from below */
  .bn.in.swap-out .headline { opacity: 0; transform: translateY(-60%); transition: opacity 160ms linear, transform 180ms var(--ease-out); }
  .bn.in.swap-in  .headline { opacity: 0; transform: translateY(60%);  transition: none; }

  .clock {
    background: var(--navy); color: #fff;
    font-weight: 700; font-size: 34px; line-height: 1;
    display: flex; align-items: center; padding: 0 26px 4px;
    direction: ltr; font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 160ms linear;
  }
  .bn.in .clock { opacity: 1; transition: opacity 300ms linear 600ms; }

  .guide { position: absolute; inset: 54px 96px; border: 2px dashed rgba(0, 255, 160, .7); pointer-events: none; }
  .guide.zone { inset: auto 96px 66px 96px; height: 86px; border-color: rgba(255, 200, 0, .8); }
</style>
</head>
<body>
  <div class="bn" id="bn">
    <div class="label">عاجل</div>
    <div class="bar" id="bar"><span class="headline" id="headline"></span></div>
    <div class="clock" id="clock">00:00</div>
  </div>

<script>
  const state = { headline: "" };
  const bn = document.getElementById("bn");

  // Long text shrinks to fit the bar (down to 30 px); beyond that it ends with "…".
  function fit(el, room, size, min) {
    el.style.fontSize = size + "px";
    el.style.maxWidth = "none";
    while (el.scrollWidth > room && size > min) el.style.fontSize = (--size) + "px";
    el.style.maxWidth = "100%";
  }

  function render() {
    const el = document.getElementById("headline");
    const bar = document.getElementById("bar");
    el.textContent = state.headline || "";
    const cs = getComputedStyle(bar);
    const room = bar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    fit(el, room, 42, 30);
  }

  function tick() {
    const d = new Date();
    document.getElementById("clock").textContent =
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tick();
  setInterval(tick, 1000);

  let swapTimer = null;
  function apply() {
    if (!bn.classList.contains("live")) { render(); return; }
    clearTimeout(swapTimer);
    bn.classList.add("swap-out");
    swapTimer = setTimeout(() => {
      render();
      bn.classList.remove("swap-out");
      bn.classList.add("swap-in");
      void bn.offsetWidth;                            // apply the "below" position before animating up
      bn.classList.remove("swap-in");
    }, 190);
  }

  // ---- CasparCG HTML template API ----
  function update(data) {
    let d = data;
    if (typeof d === "string") { try { d = JSON.parse(d); } catch (e) { return; } }
    Object.assign(state, d);
    apply();
    document.fonts.ready.then(() => { if (!bn.classList.contains("swap-out")) render(); });
  }
  let liveTimer = null;
  function play() {
    bn.classList.add("in");
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => bn.classList.add("live"), 1100);
  }
  function stop() { clearTimeout(liveTimer); clearTimeout(swapTimer); bn.classList.remove("in", "live", "swap-out", "swap-in"); }
  function next() {}

  if (location.search.includes("preview")) document.body.style.background = "#30343b";
  if (location.search.includes("guides")) {
    document.body.insertAdjacentHTML("beforeend", '<div class="guide"></div><div class="guide zone"></div>');
  }
  if (location.search.includes("demo")) {
    update('{"headline":"مجلس الأمن يعقد جلسة طارئة لبحث التطورات الأخيرة في المنطقة"}');
    setTimeout(play, 300);
    setTimeout(() => update('{"headline":"تشديد خليجي على أهمية توثيق المخالفات المرتكبة عبر وسائل الإعلام والمنصات"}'), 3500);
    setTimeout(stop, 7000);
  }
</script>
</body>
</html>
